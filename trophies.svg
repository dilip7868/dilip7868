<svg width="780" height="200" viewBox="0 0 780 200" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0b2e"/>
      <stop offset="100%" stop-color="#2d1155"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff5fa2">
        <animate attributeName="stop-color" values="#ff5fa2;#a855f7;#ff8fc7;#ff5fa2" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#ff8fc7;#a855f7;#a855f7" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .sans { font-family: -apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
      .mono { font-family: 'SFMono-Regular',Consolas,Menlo,monospace; }
      .row { opacity:0; animation: rowIn .6s ease-out forwards; }
      @keyframes rowIn { from {opacity:0; transform:translateX(-10px);} to {opacity:1; transform:translateX(0);} }
      .pop { opacity:0; transform:scale(.7); transform-box:fill-box; transform-origin:center;
        animation: popIn .5s cubic-bezier(.2,1.5,.4,1) forwards; }
      @keyframes popIn { to {opacity:1; transform:scale(1);} }
      .shine { animation: sweep 3s linear infinite; }
      @keyframes sweep { from { transform:translateX(-120%);} to { transform:translateX(220%);} }
    </style>
  </defs>

  <rect x="0" y="0" width="780" height="200" rx="14" fill="url(#bg)" stroke="#a855f7" stroke-opacity="0.5"/>

<g class="pop" style="animation-delay:0.25s" transform="translate(4.0,22)">
<rect width="122" height="140" rx="12" fill="#ffffff" fill-opacity="0.04" stroke="#ff5fa2" stroke-opacity="0.55"/>
<circle cx="61.0" cy="46" r="30" fill="none" stroke="#ff5fa2" stroke-opacity="0.35" stroke-width="4"/>
<circle cx="61.0" cy="46" r="30" fill="none" stroke="#ff5fa2" stroke-width="4" stroke-linecap="round" stroke-dasharray="188.5" stroke-dashoffset="188.5" filter="url(#glow)"><animate attributeName="stroke-dashoffset" from="188.5" to="30" dur="1.1s" begin="0.50s" fill="freeze" calcMode="spline" keySplines="0.2 1 0.3 1"/></circle>
<text x="61.0" y="53" text-anchor="middle" class="sans" font-size="20" font-weight="800" fill="#f3e8ff">A+</text>
<text x="61.0" y="100" text-anchor="middle" class="sans" font-size="12" fill="#c4b5fd">Commits</text>
<clipPath id="trophyClip0"><rect width="122" height="140" rx="12"/></clipPath>
<g clip-path="url(#trophyClip0)"><rect class="shine" style="animation-delay:1.50s" x="0" y="0" width="24" height="140" fill="#ffffff" opacity="0.08" transform="skewX(-20)"/></g>
</g>
