name: Generate Snake Animation

on:
  schedule:
    # Runs daily at 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate-snake:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate the snake animation SVG
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: dilip7868
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=#ff5fa2
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#a855f7&color_dots=#2d1155,#3b0764,#7c3aed,#a855f7,#ff5fa2
            dist/github-snake.gif?color_snake=#ff5fa2&color_dots=#2d1155,#3b0764,#7c3aed,#a855f7,#ff5fa2

      - name: Push snake output to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
